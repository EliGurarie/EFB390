# What is "urban"?

**Different things in different places** ... but basically **human-dominated** and **FRAGMENTED**.

Less wooded | more impermeable | more vehicles | structurally heterogeneous | more noisy | green space are islands

# General Features of Urban Wildlife

.Large[


- ↓ home ranges

- ↑ population densities and fecundity

- ↑ body mass

- ↓ movements

- ↓ genetic diversity

- ↓ community diversity

]
]
.pull-right-40[
![](images/albinosquirrel.jpg)
]

---

![](images/squirrelbodysize.png)

# Human Presence Effects
.Large[
Wildlife responses to constant human presence:

- ↓ diurnal activity

- ↓ anti-predator response and avoidance behavior

- ↑ habituation to humans
]


---
### **Shifts in Daily Patterns**

![](images/montana_dielpatterns.png)

Hansen et al. 2024

.pull-left-40[

# Conflicts / Costs of Urban  Wildlife

- **Economics** - Vehicle collisions, property damage

- **Health** - Disease transmission (e.g., Lyme disease)

- **Public works** - Infrastructure damage

- **Natural resources** - Habitat degradation

]

.pull-right-60[
![](images/costs.png)
]
---
class: middle
background-image: url("./images/cleveland.jpg")

# Benefits of Urban Wildlife

.pull-right-40[
.content-box-translucent.large[

- **Aesthetic / Inspiring**

- **Waste Reduction**

- **Pest Reduction**

- **Pollination / Seed Dispersal**

- **Connectivity to larger ecosystems**

- **Recreation / Appeal / Interest**

- **Community Engagement**
]

]

class: inverse

# Carrying Capacity

.pull-left-40[
### **Biological carrying capacity**

Maximum population the habitat can support

### **Cultural carrying capacity**

Maximum population humans will tolerate
]

.pull-right-60[![](images/suburbandeer.png)]

.pull-left.large[Typically, **cultural carrying capacity** is reached before **biological limits** ...]

&lt;br&gt;&lt;br&gt;
.pull-right-60[
.content-box-translucent.large[


1. Create Wildlife Corridors and Green Spaces

2. Wildlife-friendly Landscaping &amp; Architecture

3. Encourage Native Species in Urban Landscaping

4. Sustainable City Planning for Biodiversity

5. Public Education and Advocacy for Wildlife Protection

Check out some [Urban Biodiversity Strategies](https://www.c40knowledgehub.org/s/article/How-to-enhance-restore-and-protect-biodiversity-in-your-city?language=en_US)
